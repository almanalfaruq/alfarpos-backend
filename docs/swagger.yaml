paths:
  /categories:
    get:
      description: Get all categories or search by name
      parameters:
      - description: Category name query
        in: query
        name: query
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Return array of categories
          schema:
            allOf:
            - $ref: '#/definitions/response.ResponseStruct'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Category'
                  type: array
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/response.ResponseStruct'
            - properties:
                data:
                  type: string
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/response.ResponseStruct'
            - properties:
                data:
                  type: string
              type: object
      summary: Get all categories or search by name
      tags:
      - category
    post:
      consumes:
      - application/json
      description: Create a new category
      parameters:
      - description: Category data
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/model.Category'
      produces:
      - application/json
      responses:
        "201":
          description: Category created
          schema:
            allOf:
            - $ref: '#/definitions/response.ResponseStruct'
            - properties:
                data:
                  $ref: '#/definitions/model.Category'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/response.ResponseStruct'
            - properties:
                data:
                  type: string
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/response.ResponseStruct'
            - properties:
                data:
                  type: string
              type: object
      security:
      - ApiKeyAuth: []
      summary: Create a new category
      tags:
      - category
  /categories/{id}:
    delete:
      description: Delete a category by ID
      parameters:
      - description: Category ID
        in: path
